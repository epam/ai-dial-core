        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyRequest"
        required: true
      responses:
        "200":
          description: Success
          headers:
            X-UPSTREAM-ATTEMPTS:
              description: Number of upstream attempts performed before returning the response
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "401":
          description: Invalid Authentication
          content:
            application/json:
              schema:
