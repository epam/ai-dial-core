          description: The `function` that the model called.
    ChatCompletionMessageToolCallChunk:
      required:
      - index
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          description: "The type of the tool. Currently, only `function` is supported."
          enum:
          - function
        function:
          type: object
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: "The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function."
    ChatCompletionMessageToolCalls:
      type: array
      description: "The `tool` calls generated by the model, such as `function` calls."
      items:
        $ref: "#/components/schemas/ChatCompletionMessageToolCall"
    ChatCompletionNamedToolChoice:
      required:
      - function
      - type
      type: object
      properties:
        type:
          type: string
          description: "The type of the `tool`. Currently, only `function` is supported."
          enum:
          - function
        function:
          required:
          - name
          type: object
          properties:
            name:
              type: string
              description: The name of the `function` to call.
      description: Specifies a `tool` the model should use. Use to force the model to call a specific `function`.
    ChatCompletionRequest:
      required:
      - messages
      type: object
      properties:
        model:
          type: string
          description: The name of the model to use.
        messages:
          minItems: 1
          type: array
          description: A list of messages comprising the conversation so far.
          items:
            $ref: "#/components/schemas/ChatCompletionRequestMessage"
        functions:
          maxItems: 128
          minItems: 1
          type: array
          description: |
            Deprecated in favor of `tools`.

            A list of functions the model may generate JSON inputs for.
          deprecated: true
          items:
            $ref: "#/components/schemas/ChatCompletionFunction"
        function_call:
          description: |
            Deprecated in favor of `tool_choice`.

            Controls which (if any) `function` is called by the model.
          deprecated: true
          oneOf:
          - type: string
            description: |
              `none` means the model will not call a function and instead
              generates a message.

              `auto` means the model can pick between generating a message
              or calling a function.
            enum:
            - none
            - auto
          - $ref: "#/components/schemas/ChatCompletionFunctionCallOption"
        tools:
          type: array
          description: |
            A list of tools the model may call. Currently, only `functions`
            are supported as a tool. Use this to provide a list of `functions`
            the model may generate JSON inputs for. A max of 128 functions
            are supported.
          items:
            $ref: "#/components/schemas/ChatCompletionTool"
        tool_choice:
          $ref: "#/components/schemas/ChatCompletionToolChoiceOption"
        addons:
          type: array
          description: A list of Addons the Assistant can use.
          deprecated: true
          items:
            $ref: "#/components/schemas/ChatCompletionAddon"
        stream:
          type: boolean
          description: |
            If set, partial message deltas will be sent. Tokens will be sent as data-only server-sent events as they become available.
          nullable: true
          default: false
        temperature:
          maximum: 2
          minimum: 0
          type: number
          description: |
            What sampling temperature to use, between 0 and 2. Higher values such as 0.8 make the output more random, while lower values such as 0.2 make it more focused and deterministic.
          default: 1
        top_p:
          maximum: 1
          minimum: 0
          type: number
          description: |
            An alternative to sampling with temperature, called nucleus sampling.
          default: 1
        "n":
          maximum: 128
          minimum: 1
          type: integer
          description: |
            How many chat completion choices to generate for each input message.
          nullable: true
          default: 1
        parallel_tool_calls:
          $ref: "#/components/schemas/ParallelToolCalls"
        stop:
          description: Up to 4 sequences where the Assistant will stop generating further tokens.
          oneOf:
          - type: string
            nullable: true
          - maxItems: 4
            minItems: 1
            type: array
            items:
              type: string
        max_tokens:
          type: integer
          description: The maximum number of tokens to generate by the Assistant.
          default: infinity
        max_prompt_tokens:
          type: integer
          description: |
            The maximum number of prompt tokens to handle in a request.
            The feature is supported only by the model adapters and the Assistant.
          default: infinity
        max_completion_tokens:
          type: integer
          description: |
            Note the parameter is only supported in OpenAI models.

            An upper bound for the number of tokens that can be generated
            for a completion, including visible output tokens and reasoning tokens.
          nullable: true
        presence_penalty:
          maximum: 2
          minimum: -2
          type: number
          description: |
            A number between -2.0 and 2.0. Positive values impose a penalty on new tokens based on their appearance in the current text.
          default: 0
        frequency_penalty:
          maximum: 2
          minimum: -2
          type: number
          description: |
            A number between -2.0 and 2.0. Positive values apply a penalty to new tokens according to their existing frequency.
          default: 0
        logit_bias:
          type: object
          description: |
            Modifies the likelihood of specified tokens appearing in the completion.

            Accepts a JSON object that maps tokens specified by their token ID
            to an associated bias value from -100 to 100.
          nullable: true
          default: "null"
        seed:
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          type: integer
          description: |
            This feature is in Beta.

            If specified, our system will make a best effort to sample deterministically.
            Determinism is not guaranteed.
          nullable: true
        user:
          type: string
          description: A unique identifier representing the end-user.
        response_format:
          description: |
            An object specifying the format that the model must output.
          oneOf:
          - $ref: "#/components/schemas/ResponseFormatText"
          - $ref: "#/components/schemas/ResponseFormatJsonObject"
          - $ref: "#/components/schemas/ResponseFormatJsonSchema"
        custom_fields:
          $ref: "#/components/schemas/ChatCompletionsCustomFields"
    ChatCompletionRequestAssistantMessage:
      title: Assistant message
      required:
      - role
      type: object
      properties:
        content:
          description: |
            The contents of the assistant message. Required unless `tool_calls` or `function_call` is specified.
          nullable: true
          oneOf:
          - title: Text content
            type: string
            description: The contents of the assistant message.
          - title: Array of content parts
            minItems: 1
            type: array
            description: "An array of content parts with a defined type. Can be one or more of type `text`, or exactly one of type `refusal`."
            items:
              $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContentPart"
          type: string
        custom_content:
          $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageCustomContent"
        custom_fields:
          $ref: "#/components/schemas/ChatCompletionRequestCustomFields"
        refusal:
          type: string
          description: The refusal message by the assistant.
          nullable: true
        role:
          type: string
          description: "The role of the messages author, in this case `assistant`."
          enum:
          - assistant
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
        tool_calls:
          $ref: "#/components/schemas/ChatCompletionMessageToolCalls"
        function_call:
          required:
          - arguments
          - name
          type: object
          properties:
            arguments:
              type: string
              description: "The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function."
            name:
              type: string
              description: The name of the function to call.
          description: "Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model."
          nullable: true
          deprecated: true
    ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartRefusal"
    ChatCompletionRequestAssistantMessageCustomContent:
      type: object
      properties:
        state:
          type: object
          description: The internal state of the Assistant. This field can have an arbitrary set of fields with an arbitrary structure.
        attachments:
          type: array
          description: List of attachments used to supply an additional output from the model.
          items:
            $ref: "#/components/schemas/RequestAttachment"
        form_schema:
          type: object
          description: |-
            The JSON schema describing a form that the assistant prompts the user to fill in.
            Given this schema, the user is expected to provide a JSON value in the next message in the `custom_content.form_value` field.
      description: The custom content of the assistant message.
    ChatCompletionRequestCustomFields:
      type: object
      properties:
        cache_breakpoint:
          $ref: "#/components/schemas/CacheBreakpoint"
      description: DIAL-specific extensions of the Chat Completions message.
    ChatCompletionRequestDeveloperMessage:
      title: Developer message
      required:
      - content
      - role
      type: object
      properties:
        content:
          description: The contents of the developer message.
          oneOf:
          - title: Text content
            type: string
            description: The contents of the developer message.
          - title: Array of content parts
            minItems: 1
            type: array
            description: "An array of content parts with a defined type. For developer messages, only type `text` is supported."
            items:
              $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessageContentPart"
        custom_fields:
          $ref: "#/components/schemas/ChatCompletionRequestCustomFields"
        role:
          type: string
          description: "The role of the messages author, in this case `developer`."
          enum:
          - developer
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      description: |
        Developer-provided instructions that the model should follow, regardless of messages sent by the user. With o1 models and newer, `developer` messages replace the previous `system` messages.
    ChatCompletionRequestDeveloperMessageContentPart:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
    ChatCompletionRequestFunctionMessage:
      title: Function message
      required:
      - content
      - name
      - role
      type: object
      properties:
        role:
          type: string
          description: "The role of the messages author, in this case `function`."
          enum:
          - function
        content:
          description: The contents of the function message.
          nullable: true
          type: string
        custom_fields:
          $ref: "#/components/schemas/ChatCompletionRequestCustomFields"
        name:
          type: string
          description: The name of the function to call.
      deprecated: true
    ChatCompletionRequestMessage:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestSystemMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestToolMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestFunctionMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestUserMessage"
    ChatCompletionRequestMessageContentPartImage:
      title: Image content part
      required:
      - image_url
      - type
      type: object
      properties:
        type:
          type: string
          description: The type of the content part.
          enum:
          - image_url
        image_url:
          required:
          - url
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
              format: uri
            detail:
