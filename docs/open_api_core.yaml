paths:
  /anthropic/v1/messages:
    post:
      tags:
      - Anthropic
      summary: /anthropic/v1/messages
      operationId: createAnthropicMessage
      parameters:
      - name: anthropic-version
        in: header
        description: "The Anthropic API version (e.g., 2023-06-01)"
        required: true
        schema:
          type: string
      - name: X-DIAL-CACHE-POLICY
        in: header
        description: Upstream selection policy for prompt-caching deployments (availability-priority or cache-priority).
        required: false
        schema:
          type: string
          enum:
          - availability-priority
          - cache-priority
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyRequest"
        required: true
      responses:
        "200":
          description: Success
          headers:
            X-UPSTREAM-ATTEMPTS:
              description: Number of upstream attempts performed before returning the response
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "401":
          description: Invalid Authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "500":
          description: The server had an error while processing your request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "502":
          description: Failed to connect to upstream server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "503":
          description: "The engine is currently overloaded, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
