openapi: 3.0.0
info:
  title: DIAL Core API
  description: |-
    The API provides a unified interface to calling chat/completion and embedding models, as well as accessing and sharing files, conversations, and prompts.

    # Authorization
    All API requests must include the API key (or a [per-request key](https://docs.dialx.ai/platform/core/per-request-keys) when it is required) in the `Api-Key` HTTP header or the JWT token in the `Authorization` HTTP header.

    <hr style="margin:1em 0px;border-bottom:1px solid rgb(63, 63, 70);border-top-width:0px"\>

    #### Authorization with API Key (or with per-request key): ApiKeyAuth

    <br>

    ```bash
    Api-Key: DIAL_API_KEY
    ```
    <br>

    Header parameter name: `Api-Key`

    <hr style="margin:1em 0px;border-bottom:1px solid rgb(63, 63, 70);border-top-width:0px"\>

    #### HTTP Authorization: BearerAuth

    <br>

    ```bash
    Authorization: Bearer <JWT>
    ```

    <br>

    HTTP Authorization Scheme: `bearer`

    Bearer format: `JWT`

    # Deployment features

    DIAL Core adds the `X-DIAL-DEPLOYMENT-FEATURES` header to every request it forwards to a deployment, regardless of the API being called.

    <br>

    ```bash
    X-DIAL-DEPLOYMENT-FEATURES: {"tools":true,"max_tokens_supported":false,"custom_temperature_supported":false,"chat_completion":true,"responses_api":false}
    ```

    <br>

    The value is a JSON object with the features of the deployment: the flags configured in `features` of the model or application in the DIAL Core config.

    DIAL Core always sets this header itself, so a value sent by a client is overwritten and never reaches the deployment.
