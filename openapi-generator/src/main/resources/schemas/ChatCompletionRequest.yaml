type: object
additionalProperties: true
required: [messages]
properties:
  model: { type: string }
  messages:
    type: array
    items:
      $ref: '#/components/schemas/Message'
  functions:
    type: array
    items:
      $ref: '#/components/schemas/Function'
  function_call:
    oneOf:
      - type: string
        enum: [auto, none]
      - $ref: '#/components/schemas/FunctionChoice'
  tools:
    type: array
    items:
      oneOf:
        - $ref: '#/components/schemas/Tool'
        - $ref: '#/components/schemas/StaticTool'
  tool_choice:
    oneOf:
      - type: string
        enum: [auto, none, required]
      - $ref: '#/components/schemas/ToolChoice'
  stream:
    type: boolean
    default: false
  stream_options:
    $ref: '#/components/schemas/StreamOptions'
  temperature:
    type: number
    minimum: 0
    maximum: 2
  top_p:
    type: number
    minimum: 0
    maximum: 1
  n:
    type: integer
    minimum: 1
    maximum: 128
  stop:
    oneOf:
      - type: string
      - type: array
        maxItems: 4
        items:
          type: string
  max_tokens:
    type: integer
    minimum: 1
  max_completion_tokens:
    type: integer
    minimum: 1
  presence_penalty:
    type: number
    minimum: -2
    maximum: 2
  frequency_penalty:
    type: number
    minimum: -2
    maximum: 2
  logit_bias:
    type: object
    additionalProperties:
      type: number
  user: { type: string }
  seed: { type: integer }
  logprobs: { type: boolean }
  top_logprobs: { type: integer }
  reasoning_effort:
    type: string
    enum: [none, minimal, low, medium, high]
  response_format:
    oneOf:
      - $ref: '#/components/schemas/ResponseFormatText'
      - $ref: '#/components/schemas/ResponseFormatJsonObject'
      - $ref: '#/components/schemas/ResponseFormatJsonSchema'
  parallel_tool_calls: { type: boolean }
  max_prompt_tokens:
    type: integer
    minimum: 1
  custom_fields:
    $ref: '#/components/schemas/ChatCompletionRequestCustomFields'
