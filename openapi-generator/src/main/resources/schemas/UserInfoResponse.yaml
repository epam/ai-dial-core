type: object
properties:
    roles:
      type: array
      description: List of user or API key authorization roles
      items:
        type: string
    project:
      type: string
      description: The caller's project. For API key authentication it is the key's project; for user-based session authentication it is resolved from the identity provider's configured projectPath claim path. Absent when the token has no project.
    userClaims:
      type: object
      description: Normalized token claims. Present only for user-based session authentication.
      additionalProperties:
        type: array
        description: Array representation of a specific claim value (normalized for backward compatibility)
        items:
          type: string