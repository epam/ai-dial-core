// TODO: move this to main build.gradle or gradle.properties file to manage dependency versions centrally on project level?
ext {
    slf4j_version = "2.0.9"
    httpclient_version = "5.4.3"
    jackson_version = "2.15.2"
    oauth2_oidc_sdk_version = "11.27.1"
    guava_version = "33.4.8-jre"
    junit_version = "5.9.3"
    mockito_version = "5.7.0"
}

dependencies {
    // Project dependencies (internal modules)
    implementation project(':config')
    implementation project(':storage')

    // External dependencies with variables for versions
    implementation("org.slf4j:slf4j-api:${slf4j_version}")
    implementation("org.apache.httpcomponents.client5:httpclient5:${httpclient_version}")
    implementation("com.fasterxml.jackson.core:jackson-databind:${jackson_version}")
    implementation("com.nimbusds:oauth2-oidc-sdk:${oauth2_oidc_sdk_version}")
    implementation("com.google.guava:guava:${guava_version}")

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junit_version}")
    testImplementation("org.mockito:mockito-core:${mockito_version}")
    testImplementation("org.mockito:mockito-junit-jupiter:${mockito_version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junit_version}")
}

test {
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat = "full"
    }
    useJUnitPlatform()
}