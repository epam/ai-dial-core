---
kind: Model
name: models/public/example-chat-model
spec:
  type: chat
  displayName: "Example Chat Model"
  endpoint: "http://localhost:7001/openai/deployments/example/chat/completions"
  upstreams:
    - endpoint: "http://localhost:7001"
      key: "REPLACE_WITH_YOUR_UPSTREAM_KEY"
  features:
    systemPromptSupported: true
    toolsSupported: true
    streamingSupported: true
  userRoles: ["example-user"]
