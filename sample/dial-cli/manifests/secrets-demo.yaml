---
# Opt-in demo — NOT applied by `apply -f manifests/base/`.
#
# Demonstrates the two env-driven placeholder forms resolved at write time:
#   ${SECRET:NAME}  — fail-loud lookup via System.getenv("NAME")
#   ${ENV_VAR}      — same lookup as a bare placeholder (shell-style fallback)
#
# Apply with:
#   export DIAL_UPSTREAM_KEY=sk-...
#   export DIAL_UPSTREAM_HOST=http://localhost:7001
#   dial-cli apply -f manifests/secrets-demo.yaml --env local --dry-run
#
# Missing env vars fail loudly per 05-cli-design.md §3.1 / IMPLEMENTATION.md 4C.4 —
# no silent empty-string substitution.
kind: Model
name: models/public/example-secrets-demo
spec:
  type: chat
  displayName: "Secrets Demo"
  endpoint: "${DIAL_UPSTREAM_HOST}/openai/deployments/secrets-demo/chat/completions"
  upstreams:
    - endpoint: "${DIAL_UPSTREAM_HOST}"
      key: "${SECRET:DIAL_UPSTREAM_KEY}"
  userRoles: ["example-user"]
