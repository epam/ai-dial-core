---
# Uses the `bedrock-chat` template from config.yaml — the CLI resolves
# endpoint / iconUrl / upstreams / type / features / forwardAuthToken from the
# template before sending; only fields below override or add to that result.
# See 05-cli-design.md §3 for the merge order.
kind: Model
name: models/public/example-chat-model
template: bedrock-chat
params:
  regions: [us-east-1, us-west-2]
spec:
  displayName: "Example Chat Model"
  userRoles: ["example-user"]
