---
kind: Settings
name: global
spec:
  # Singleton — there's exactly one Settings document at /v1/settings/platform/global.
  # Apply uses upsert semantics; first apply replaces file-sourced fields,
  # `dial-cli settings delete --env local` releases API control back to the
  # config file (or schema defaults).
  globalInterceptors: ["interceptors/platform/example-interceptor"]
  retriableErrorCodes: [502, 503]
