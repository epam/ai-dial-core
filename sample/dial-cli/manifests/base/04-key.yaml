---
kind: Key
name: keys/platform/example-ci-key
spec:
  project: "ExampleCI"
  roles: ["example-user"]
  secured: false
  # Key.key is required — the server rejects a blank value (400 Bad Request).
  # Set DIAL_CI_KEY before applying:  export DIAL_CI_KEY=<your-api-key>
  key: "${SECRET:DIAL_CI_KEY}"
