# dial-cli profile — playground.
# Copy / edit / point DIAL_CLI_CONFIG at this file (or pass --config).
# Sibling of sample/aidial.config.json + sample/aidial.settings.json.
#
# Both environments point at the same local DIAL Core so the playground is
# runnable with a single docker container; promotion / overlay / diff demos
# still exercise the multi-env CLI paths even though the URL is identical.

defaults:
  output: table
  env: local

environments:
  local:
    api_url: "http://localhost:8080"
    auth:
      type: api_key
      key_env_var: DIAL_LOCAL_API_KEY
    vars:
      adapter_host: "http://localhost:7001"
      icon_base_url: ""
      forward_auth_token: "false"

  staging:
    api_url: "http://localhost:8080"
    auth:
      type: api_key
      key_env_var: DIAL_LOCAL_API_KEY
    vars:
      adapter_host: "http://localhost:7001"
      icon_base_url: "https://example.com/icons"
      forward_auth_token: "true"

# Templates — reusable, entity-type-agnostic field patterns the CLI deep-merges
# into manifest `spec` at write time. See 05-cli-design.md §3 and
# 06-cli-user-guide.md §1.2 for the full DSL surface.
templates:
  # Base — common chat-model shape every adapter family inherits.
  chat-base:
    description: "Common chat-model feature set"
    fields:
      type: chat
      features:
        systemPromptSupported: true
        toolsSupported: true
        streamingSupported: true

  # Mixin — conditionally forward the caller's auth header. Demonstrates `!if`.
  # Note: the `!if` expression is unquoted; quoting the whole expression makes
  # the parser treat it as a single string literal and skip placeholder
  # resolution. Embedded literals use single quotes ('true').
  forward-auth-when-enabled:
    fields:
      !if ${vars.forward_auth_token} == 'true':
        forwardAuthToken: true

  # Concrete template — extends + includes + !for + functions + placeholders.
  bedrock-chat:
    description: "Bedrock-style chat model — composes chat-base + auth mixin"
    extends: chat-base
    includes: [forward-auth-when-enabled]
    fields:
      endpoint: "${vars.adapter_host}/openai/deployments/${entity.name}/chat/completions"
      iconUrl: "${default(vars.icon_base_url, '')}/${replace(entity.name, '.', '-')}.svg"
      upstreams:
        !for { in: "${params.regions}", as: region }:
          - endpoint: "${vars.adapter_host}/openai/deployments/${entity.name}/chat/completions"
            extraData:
              region: "${region}"
