name: Release Workflow

on:
  push:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/java_release.yml@3.1.3
    secrets: inherit
    with:
      platforms: "linux/amd64,linux/arm64"
      java-version: 21
