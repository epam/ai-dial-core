name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/java_pr.yml@4.4.1
    secrets: inherit
    with:
      platforms: "linux/amd64,linux/arm64"
      java-version: 21
      trivy-limit-severities-for-sarif: false

  validate_openai_spec_generation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
      - uses: epam/ai-dial-ci/actions/java_prepare@4.6.0
        with:
          java-version: 21
          java-distribution: temurin
      - name: validate_spec
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew publishOpenApiSpec \
            -Pgpr.user=$GITHUB_ACTOR \
            -Pgpr.key=$GITHUB_TOKEN
